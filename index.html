<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕开宝马 · Pelican × BMW</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: clamp(12px, 3vw, 40px);
    background: #0a0813 radial-gradient(1200px 800px at 30% 10%, #1c1838 0%, #0a0813 55%, #07060f 100%);
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  }
  .stage {
    width: min(1180px, 100%);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .85), 0 0 0 1px rgba(255, 255, 255, .06);
    animation: rise .8s ease-out both;
  }
  svg { display: block; width: 100%; height: auto; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只戴墨镜的鹈鹕开着蓝色宝马敞篷车在黄昏公路上兜风">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#101732"/>
      <stop offset=".32" stop-color="#35336e"/>
      <stop offset=".55" stop-color="#7a4f83"/>
      <stop offset=".72" stop-color="#c96a6f"/>
      <stop offset=".86" stop-color="#ff9d63"/>
      <stop offset="1"   stop-color="#ffc47f"/>
    </linearGradient>
    <radialGradient id="sunGrad">
      <stop offset="0"   stop-color="#fff8dd"/>
      <stop offset=".45" stop-color="#ffd377"/>
      <stop offset=".8"  stop-color="#ff9f52"/>
      <stop offset="1"   stop-color="#ff9f52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop offset="0"   stop-color="#ffc878" stop-opacity=".85"/>
      <stop offset=".5"  stop-color="#ffa05a" stop-opacity=".32"/>
      <stop offset="1"   stop-color="#ffa05a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221a3a"/>
      <stop offset="1" stop-color="#0e0a1c"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8bb8f9"/>
      <stop offset=".3"  stop-color="#3a70d8"/>
      <stop offset=".62" stop-color="#1e47a4"/>
      <stop offset="1"   stop-color="#10295f"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ebf6ff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#a0c3f0" stop-opacity=".75"/>
      <stop offset="1"   stop-color="#78a0d7" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="pelicanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#eef3fa"/>
      <stop offset="1"   stop-color="#d8e0ee"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffcf63"/>
      <stop offset=".55" stop-color="#f7ab2e"/>
      <stop offset="1"   stop-color="#ec8f16"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffdd8e"/>
      <stop offset=".5"  stop-color="#f9bc55"/>
      <stop offset="1"   stop-color="#ee9c2d"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26263f"/>
      <stop offset="1" stop-color="#0e0e19"/>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf6"/>
      <stop offset="1" stop-color="#b3bfd2"/>

    <radialGradient id="wellGrad">
      <stop offset="0" stop-color="#0d1322"/>
      <stop offset="1" stop-color="#060a14"/>

    <radialGradient id="vignette" cx=".5" cy=".45" r=".75">

      <stop offset=".72" stop-color="#08060f" stop-opacity="0"/>
      <stop offset="1"   stop-color="#08060f" stop-opacity=".52"/>

    <rect x="26" y="548" width="108" height="5" rx="2.5" opacity=".12">

    </rect>
  </g>

  <!-- 尾气尘土 -->
  <g>
    <circle cx="316" cy="636" r="8" fill="#d8c6ae">
      <animate attributeName="r" values="6;24;30" dur="1.4s" repeatCount="indefinite"/>

  <!-- ======= 汽车 + 鹈鹕 ======= -->
